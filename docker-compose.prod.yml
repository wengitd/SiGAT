services:
  postgres:
    build: ./database
    image: sigat-postgres:latest
    container_name: sigat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      target: production
    image: sigat-backend:latest
    container_name: sigat_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: production
      PYTHONDONTWRITEBYTECODE: "1"
      FACTURAS_STORAGE_PATH: /data/facturas
      ACTAS_STORAGE_PATH: /data/actas
    volumes:
      - facturas_data:/data/facturas
      - actas_data:/data/actas
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: /api
    image: sigat-frontend:latest
    container_name: sigat_frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

# El volumen de datos se utiliza para persistir los datos
# Si el usuario quiere almacenar en otra 
# ubicación, debe cambiar el nombre del volumen y la ruta en el archivo docker-compose.prod.yml

volumes:
  postgres_data:
  facturas_data: 
  actas_data: 