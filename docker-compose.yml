
services:
  postgres:
    build: ./database
    image: sigat-postgres:latest
    container_name: sigat_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      target: development
    image: sigat-backend:dev
    container_name: sigat_backend_dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: development
      PYTHONDONTWRITEBYTECODE: "1"
      FACTURAS_STORAGE_PATH: /data/facturas
      ACTAS_STORAGE_PATH: /data/actas
    volumes:
      - ./backend:/app
      - facturas_data:/data/facturas
      - actas_data:/data/actas

  frontend:
    build:
      context: ./frontend
      target: development
      args:
        VITE_API_URL: http://localhost:8000
    image: sigat-frontend:dev
    container_name: sigat_frontend_dev
    restart: unless-stopped
    shm_size: "256mb"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data_dev:
  frontend_node_modules:
  facturas_data:
  actas_data:
